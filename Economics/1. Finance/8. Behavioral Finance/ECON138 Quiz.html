<script>

const TOPICS = {

const state = {
  apiKey: "",
  model: "",
  qtype: "",
  lectureFilter: "",

  nextPromise: null,
  history: [],

  total: 0,

// --------------------- API plumbing ---------------------

async function callClaude(systemPrompt, userPrompt, maxTokens = 1500) {
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": state.apiKey,
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: state.model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: "user", content: userPrompt }],
    }),
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`API error ${resp.status}: ${errText}`);
  }
  const data = await resp.json();
  if (!data.content || !data.content[0] || !data.content[0].text) {
    throw new Error("Unexpected API response: " + JSON.stringify(data));
  }
  return data.content[0].text;
}

function extractJSON(raw) {
  let s = raw.trim();
  // Strip code fences
  s = s.replace(/^```(?:json)?\s*/i, "").replace(/\s*```\s*$/i, "");
  // Find first { and last } to be tolerant of stray preamble
  const first = s.indexOf("{");
  const last = s.lastIndexOf("}");
  if (first >= 0 && last > first) s = s.slice(first, last + 1);
  return JSON.parse(s);
}

// --------------------- Question generation ---------------------

function pickQType() {
  if (state.qtype !== "mixed") return state.qtype;
  const pool = ["mcq", "short", "quant"];
  return pool[Math.floor(Math.random() * pool.length)];
}

function pickLecture() {
  if (state.lectureFilter !== "any") return parseInt(state.lectureFilter, 10);
  const keys = Object.keys(TOPICS).map(Number);
  return keys[Math.floor(Math.random() * keys.length)];
}

// Style guide derived from the ECON 138 staff Practice Exam II (April 2026).
// Injected into every question-generation call so outputs match the staff exam's
// wording, length, citation style, and distractor style.
const STAFF_STYLE_GUIDE = `
You must write questions in the exact style of the UC Berkeley ECON 138 staff exams. The template is the Midterm II Practice Exam (Berkeley Econ 138, Apr 1 2026). Follow these staff conventions strictly:

GENERAL STAFF VOICE
- Terse, declarative, textbook-formal. No casual asides, no second-person "you" except in quantitative setups ("Suppose you live in a town where...").
- Embed full paper citations inline when a result is attributed: "Jegadeesh and Titman (1993)", "Odean (1998)", "Barber and Odean (2000)", "Miller's (1977) theory", "Chen, Moskowitz, and Shue (2016)", "Hong & Stein (1999)", "Kahneman and Tversky in their 1979 paper".
- Answers are as brief as possible. "Points will be subtracted for irrelevant material."

MCQ STYLE (Section 1 of the staff exam)
- Each MCQ uses a named individual in a concrete everyday scenario: Emily, Sarah, John, Mike, Lisa, Tom, Anna, David, Rachel, Ben, etc. Always a first name, never "an investor" or "a subject".
- Four choices labeled "(a)" "(b)" "(c)" "(d)", each a complete scenario or statement of 1-3 lines. NOT single-word answers.
- Canonical openers (rotate through these):
  * "Consider the following scenarios. Which one is most consistent with <theory/finding>?"
  * "Which of the following scenarios best exemplifies the concept of <concept>?"
  * "According to the research by <author(s)> (<year>), which of the following statements best describes <agent>'s next decision?"
  * "Which statement best explains why this mispricing might persist?"
  * "Which of the following observations most strongly suggests that <alternative explanation> alone cannot fully explain this effect?"
- Distractors must be plausible common misconceptions or near-misses. Frequently mix up paired concepts (gambler's fallacy vs hot-hand, conservatism vs overreaction, disposition effect vs tax-loss harvesting, representativeness vs availability).
- When the MCQ involves numbers (e.g., the Palm/3Com stub), set up the full calculation in the stem and ask which statement best EXPLAINS the result — the student does not compute in an MCQ, they interpret.
- The correct answer's explanation is 1-3 sentences maximum.

SHORT-ANSWER STYLE (Section 2 of the staff exam)
- Openers (rotate):
  * "What is the <phenomenon> in stock returns, as documented by <author(s)> (<year>)?"
  * "How does <mechanism> lead to <outcome>?"
  * "Explain <author>'s (<year>) theory on <topic>."
  * "What distinguishes <X> from <Y>?"
  * "In the study '<title>' by <authors> (<year>), what impact does <treatment> have on <outcome>?"
  * "Briefly describe the mechanism by which <X> generates <Y>."
- Model answer: 2-4 sentences, terse, no preamble. Begins directly with the substantive claim ("Jegadeesh and Titman show that..." / "Risk refers to..." / "According to Miller's theory..."). No filler like "This is a great question" or "Let me explain".
- Each rubric point is ONE concrete verifiable fact. Rubrics have 2-4 points.

QUANTITATIVE STYLE (Section 4 of the staff exam)
- Set up a concrete everyday scenario with a named individual or town: "Suppose you live in a town where X% are doctors and Y% are teachers. A random individual, Lisa, is selected..." / "Consider an investor, Tom, with prospect-theory preferences..." / "Sarah faces the following (beta, delta) discounting problem..."
- Use realistic round-ish numbers: percentages as 10%, 20%, 30%, 80%; probabilities 0.1, 0.2, 0.5; beta = 0.6 or 0.7; delta = 0.95 or 0.99; lambda = 2.25; reference point = 0; etc.
- The question should require a Bayesian update, a (β,δ) preference-reversal calculation, a prospect-theory gamble valuation with given lambda and weighting, an expected-return / Sharpe calculation, a PGR vs PLR decomposition, or similar.
- Show every Bayes / algebra step in the model_solution, using LaTeX. Include the intermediate fractions, not just the final number. Follow the Bayes layout pattern from the staff exam:
  $P(A \\mid B) = \\frac{P(B \\mid A) \\cdot P(A)}{P(B \\mid A) \\cdot P(A) + P(B \\mid \\neg A) \\cdot P(\\neg A)} = \\frac{(0.80)(0.10)}{(0.80)(0.10) + (0.20)(0.90)} = \\frac{0.08}{0.26} \\approx 30.77\\%$.
- Where appropriate, the stem asks the student to both (i) compute the number and (ii) interpret whether the result indicates a specific bias. Include both requirements in the stem.

FORMATTING
- Use $...$ and $$...$$ LaTeX for all math. Never use Unicode math symbols.
- Never mention slides, lecture numbers, or "as we saw in class". The question must stand alone.
- Never use markdown headers inside a question stem.
`;

function questionSystemPrompt() {
  return `You are a teaching assistant for UC Berkeley's ECON 138 Behavioral Finance course (Prof. Ulrike Malmendier), writing new practice questions in the exact style of the staff's Practice Exam II (April 2026) for Midterm II material (Lectures 11-19). Your questions must be ORIGINAL — do not duplicate questions from the staff practice exam verbatim — but must match the staff exam's format, wording, citation style, length, and distractor design as closely as possible. Respond with ONLY a single valid JSON object. No markdown fences, no prose outside the JSON.

${STAFF_STYLE_GUIDE}`;
}

function questionUserPrompt(qtype, lecture) {
  const info = TOPICS[lecture];
  const topicList = info.topics.map((t) => "  - " + t).join("\n");
  const avoid =
    state.history.length > 0
      ? `\n\nRecent questions you have just asked. Do NOT repeat or paraphrase any of these — pick a different topic area or a different angle:\n${state.history
          .map((h, i) => `  ${i + 1}. ${h}`)
          .join("\n")}`
      : "";

  const formatSpec =
    qtype === "mcq"
      ? `Format: multiple-choice conceptual question.
Return JSON with exactly these fields:
{
  "type": "mcq",
  "lecture": ${lecture},
  "topic": "<the specific topic area from the list above>",
  "question": "<question stem, 1-4 sentences, may include LaTeX>",
  "choices": ["(a) <option>", "(b) <option>", "(c) <option>", "(d) <option>"],
  "correct": "<one of a|b|c|d>",
  "explanation": "<2-4 sentences explaining why the correct answer is right and why the strongest distractor is wrong>"
}
Guidelines:
- Exactly four choices, exactly one correct.
- Distractors must be plausible common misconceptions or near-misses, not obviously wrong.
- Prefer questions that test understanding of a mechanism or distinction over pure recall.`
      : qtype === "short"
      ? `Format: short-answer conceptual question.
Return JSON with exactly these fields:
{
  "type": "short",
  "lecture": ${lecture},
  "topic": "<the specific topic area from the list above>",
  "question": "<question stem requiring a 2-4 sentence answer>",
  "model_answer": "<a 2-4 sentence model answer>",
  "rubric": ["<key point 1>", "<key point 2>", "<key point 3 if relevant>"]
}
Guidelines:
- The question should require the student to explain a mechanism, define a concept, or contrast two ideas.
- Rubric points are the distinct facts or reasoning steps the grader should look for.`
      : `Format: quantitative problem (calculation).
Return JSON with exactly these fields:
{
  "type": "quant",
  "lecture": ${lecture},
  "topic": "<the specific topic area from the list above>",
  "question": "<question stem with ALL numeric inputs, use LaTeX for math>",
  "numeric_answer": <final numeric answer as a plain number, or null if not single-number>,
  "answer_tolerance": <acceptable fractional tolerance, e.g. 0.02 for 2%>,
  "final_answer_text": "<short string showing the final answer, e.g. '0.375' or '\\\\$12{,}500'>",
  "model_solution": "<full step-by-step solution in markdown with LaTeX, 4-10 lines>"
}
Guidelines:
- Use realistic numbers. Examples of good quantitative topics: Bayesian posterior updates, (beta,delta) discounting preference reversal, prospect-theory gamble valuation with given lambda and weighting, expected returns under extrapolation, portfolio share under CRRA, Sharpe ratio of a momentum strategy with given stats, disposition-effect PGR/PLR calculation.
- If the answer is not a single number (e.g., "both A and B"), set numeric_answer to null and rely on model_solution + final_answer_text.
- Show every step in model_solution.`;

  return `Generate ONE ${qtype.toUpperCase()} question drawn from Lecture ${lecture} — ${info.title}.

Topic areas you may draw from (pick ONE and drill into it):
${topicList}

${formatSpec}${avoid}`;
}

async function generateQuestion() {
  const qtype = pickQType();
  const lecture = pickLecture();
  const raw = await callClaude(questionSystemPrompt(), questionUserPrompt(qtype, lecture), 1800);
  const q = extractJSON(raw);
  // Sanity defaults
  if (!q.type) q.type = qtype;
  if (!q.lecture) q.lecture = lecture;
  return q;
}

// --------------------- Grading ---------------------

async function gradeAnswer(q, userAnswer) {
  // MCQ: direct check
  if (q.type === "mcq") {
    const correct = userAnswer.toLowerCase() === String(q.correct).toLowerCase();
    return {
      correct,
      score: correct ? 1 : 0,
      feedback: q.explanation || (correct ? "Correct." : "Incorrect."),
    };
  }

  // Quant with numeric answer: check tolerance first for an auto-correct
  if (q.type === "quant" && q.numeric_answer !== null && q.numeric_answer !== undefined) {
    const parsed = parseFloat(String(userAnswer).replace(/[,$%\s]/g, ""));
    if (!isNaN(parsed)) {
      const target = parseFloat(q.numeric_answer);
      const tol = q.answer_tolerance || 0.02;
      const absErr = Math.abs(parsed - target);
      const relErr = Math.abs(target) > 1e-12 ? absErr / Math.abs(target) : absErr;
      if (relErr <= tol || absErr <= tol) {
        return {
          correct: true,
          score: 1,
          feedback: `Within tolerance (${(relErr * 100).toFixed(2)}% off).`,
          auto: true,
        };
      }
      // else fall through to model grading for partial credit on method
    }
  }

  // Short answer or quant needing rubric grading: ask Claude
  const gradingSystem = `You are a strict but fair grader for UC Berkeley ECON 138 Behavioral Finance exam answers. You grade on substance, not wording. Accept paraphrases and equivalent expressions. Deduct for missing key points, incorrect reasoning, or mechanism confusion. Respond with ONLY a single valid JSON object.`;

  const rubricText = q.rubric && q.rubric.length ? "Rubric key points:\n" + q.rubric.map((r) => "  - " + r).join("\n") : "";
  const modelRef = q.model_answer || q.model_solution || "(no model answer provided)";

  const gradingUser = `Grade this student answer.

=== Question ===
${q.question}

=== Model answer / reference solution ===
${modelRef}

${rubricText}

=== Student answer ===
${userAnswer}

Grade the student answer for correctness and completeness. Return JSON:
{
  "score": <number between 0.0 and 1.0>,
  "correct": <true if score >= 0.75, else false>,
  "feedback": "<2-4 sentences: what the student got right, what they missed, and the key correct reasoning they should internalize>"
}`;

  const raw = await callClaude(gradingSystem, gradingUser, 800);
  return extractJSON(raw);
}

// --------------------- Rendering ---------------------

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on")) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function renderMath(node) {
  if (window.renderMathInElement) {
    try {
      renderMathInElement(node, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true },
        ],
        throwOnError: false,
      });
    } catch (e) {
      console.warn("KaTeX render failed", e);
    }
  }
}

function renderQuestion(q) {
  const qb = document.getElementById("questionBox");
  qb.innerHTML = "";

  const lectureTitle = TOPICS[q.lecture] ? TOPICS[q.lecture].title : "";
  document.getElementById("meta").textContent =
    `Lecture ${q.lecture} — ${lectureTitle} · ${q.topic || ""} · ${q.type.toUpperCase()}`;

  const qp = el("div", { class: "question-text" });
  qp.textContent = q.question;
  qb.appendChild(qp);

  if (q.type === "mcq") {
    const list = el("div", { class: "choices" });
    (q.choices || []).forEach((c, i) => {
      const letter = "abcd"[i];
      const lbl = el("label", { class: "choice" });
      const radio = el("input", { type: "radio", name: "answer", value: letter });
      const span = el("span");
      span.textContent = c;
      lbl.appendChild(radio);
      lbl.appendChild(span);
      list.appendChild(lbl);
    });
    qb.appendChild(list);
  } else {
    const ta = el("textarea", {
      id: "answerInput",
      rows: q.type === "quant" ? 4 : 6,
      placeholder:
        q.type === "quant"
          ? "Numeric answer (or brief work). Tip: press Ctrl+Enter to submit."
          : "Your answer (2-4 sentences). Tip: press Ctrl+Enter to submit.",
    });
    ta.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        onSubmit();
      }
    });
    qb.appendChild(ta);
    setTimeout(() => ta.focus(), 50);
  }

  document.getElementById("gradeBox").innerHTML = "";
  document.getElementById("submitBtn").style.display = "";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("nextBtn").style.display = "none";

  renderMath(qb);
}

async function showNext() {
  const qb = document.getElementById("questionBox");
  qb.innerHTML = "<div class='spinner'>Generating question…</div>";
  document.getElementById("meta").textContent = "…";
  document.getElementById("gradeBox").innerHTML = "";
  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";

  let q;
  try {
    if (state.nextPromise) {
      q = await state.nextPromise;
      state.nextPromise = null;
    }
    if (!q) q = await generateQuestion();
  } catch (e) {
    qb.innerHTML = "";
    qb.appendChild(el("div", { class: "err" }, "Question generation failed: " + e.message));
    const retry = el("button", { onclick: showNext }, "Retry");
    qb.appendChild(retry);
    return;
  }

  state.current = q;
  const stem = (q.question || "").replace(/\s+/g, " ").slice(0, 140);
  state.history.push(`[L${q.lecture} ${q.type}] ${stem}`);
  if (state.history.length > 10) state.history.shift();

  renderQuestion(q);

  // Prefetch the next question in the background
  state.nextPromise = generateQuestion().catch((e) => {
    console.warn("Prefetch failed", e);
    return null;
  });
}

async function onSubmit() {
  const q = state.current;
  if (!q) return;

  let userAnswer;
  if (q.type === "mcq") {
    const sel = document.querySelector('input[name="answer"]:checked');
    if (!sel) {
      alert("Pick an answer first.");
      return;
    }
    userAnswer = sel.value;
  } else {
    const ta = document.getElementById("answerInput");
    userAnswer = ta.value.trim();
    if (!userAnswer) {
      alert("Type an answer first.");
      return;
    }
    ta.disabled = true;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  const gb = document.getElementById("gradeBox");
  gb.innerHTML = "<div class='spinner'>Grading…</div>";

  let grade;
  try {
    grade = await gradeAnswer(q, userAnswer);
  } catch (e) {
    gb.innerHTML = "";
    gb.appendChild(el("div", { class: "err" }, "Grading failed: " + e.message));
    submitBtn.disabled = false;
    return;
  }

  state.total += 1;
  if (grade.correct) state.correct += 1;
  document.getElementById("score").textContent = `${state.correct} / ${state.total}`;

  gb.innerHTML = "";
  const verdict = el("div", { class: "verdict " + (grade.correct ? "ok" : "bad") });
  verdict.textContent = grade.correct ? "✓ Correct" : "✗ Incorrect";
  if (typeof grade.score === "number" && !grade.correct && grade.score > 0) {
    verdict.textContent += ` (${Math.round(grade.score * 100)}% credit)`;
  }
  gb.appendChild(verdict);

  // Show the canonical correct answer
  if (q.type === "mcq") {
    const cor = el("div", { class: "correct-line" });
    cor.innerHTML = "<b>Correct answer:</b> ";
    const idx = "abcd".indexOf(String(q.correct).toLowerCase());
    cor.appendChild(document.createTextNode(idx >= 0 && q.choices ? q.choices[idx] : q.correct));
    gb.appendChild(cor);
  } else if (q.type === "quant" && q.final_answer_text) {
    const cor = el("div", { class: "correct-line" });
    cor.innerHTML = "<b>Correct answer:</b> ";
    const span = el("span");
    span.textContent = q.final_answer_text;
    cor.appendChild(span);
    gb.appendChild(cor);
  }

  const fb = el("div", { class: "feedback" });
  fb.textContent = grade.feedback || "";
  gb.appendChild(fb);

  const modelAnswer = q.model_solution || q.model_answer;
  if (modelAnswer) {
    const details = el("details");
    const summary = el("summary");
    summary.textContent = q.type === "quant" ? "Show full solution" : "Show model answer";
    const body = el("div", { class: "model-answer" });
    body.textContent = modelAnswer;
    details.appendChild(summary);
    details.appendChild(body);
    gb.appendChild(details);
  }

  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("nextBtn").style.display = "";
  document.getElementById("nextBtn").focus();

  renderMath(gb);
}

// --------------------- Wiring ---------------------

document.getElementById("startBtn").addEventListener("click", async () => {
  const key = document.getElementById("apiKey").value.trim();
  const errBox = document.getElementById("setupErr");
  errBox.style.display = "none";
  if (!key) {
    errBox.textContent = "Please paste your Anthropic API key.";
    errBox.style.display = "";
    return;
  }
  state.apiKey = key;
  state.model = document.getElementById("model").value;
  state.qtype = document.getElementById("qtype").value;
  state.lectureFilter = document.getElementById("lecture").value;

  document.getElementById("setup").style.display = "none";
  document.getElementById("quiz").style.display = "";
  await showNext();
});

document.getElementById("submitBtn").addEventListener("click", onSubmit);
document.getElementById("nextBtn").addEventListener("click", showNext);
document.getElementById("quitBtn").addEventListener("click", () => {
  if (state.total === 0 || confirm("End this session? Your score will be lost.")) {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("setup").style.display = "";
    state.current = null;
    state.nextPromise = null;
    state.history = [];
    state.correct = 0;
    state.total = 0;
    document.getElementById("score").textContent = "0 / 0";
  }
});
</script>
</body>
